<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RiskSnap Spot FX History</title>

  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #ffffff;
      color: #222222;
    }

    h1 {
      color: white;
      text-align: center;
      background-color: #3A5FCD;
      padding: 12px;
      border-radius: 6px;
    }

    .controls {
      margin: 16px 0;
      padding: 12px;
      border: 1px solid #dddddd;
      border-radius: 8px;
      background: #f7f7f7;
    }

    label {
      font-weight: bold;
      margin-right: 8px;
    }

    select, button {
      font-size: 15px;
      padding: 6px 10px;
      margin-right: 8px;
    }

    button {
      background-color: #3A5FCD;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    #chart {
      width: 100%;
      height: 650px;
    }

    #status {
      margin-top: 10px;
      color: #555555;
      font-size: 14px;
    }

    .note {
      font-size: 13px;
      color: #555555;
      margin-top: 12px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <h1 id="pageTitle">Spot Foreign Exchange History</h1>

  <div class="controls">
    <label for="pairSelect">Currency pair:</label>
    <select id="pairSelect">
      <option value="EURUSD">EUR/USD</option>
      <option value="USDJPY">USD/JPY</option>
      <option value="GBPUSD">GBP/USD</option>
      <option value="USDCHF">USD/CHF</option>
      <option value="USDCAD">USD/CAD</option>
    </select>

    <button id="updateButton" type="button" onclick="loadSelectedPair()">Update Chart</button>
  </div>

  <div id="chart"></div>
  <div id="status">Loading...</div>

  <div class="note">
    Data source: Federal Reserve Economic Data (FRED), daily foreign exchange rates.
    Rates are shown in native market convention and are not log-transformed.
    Missing values are omitted.
  </div>

  <script>
    const fredMap = {
      EURUSD: { id: "DEXUSEU", title: "EUR/USD", units: "USD per EUR" },
      USDJPY: { id: "DEXJPUS", title: "USD/JPY", units: "JPY per USD" },
      GBPUSD: { id: "DEXUSUK", title: "GBP/USD", units: "USD per GBP" },
      USDCHF: { id: "DEXSZUS", title: "USD/CHF", units: "CHF per USD" },
      USDCAD: { id: "DEXCAUS", title: "USD/CAD", units: "CAD per USD" }
    };

    function getPairFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const pair = (params.get("pair") || "EURUSD").toUpperCase();
      return fredMap[pair] ? pair : "EURUSD";
    }

    function setUrlPair(pair) {
      const newUrl = `${window.location.pathname}?pair=${pair}`;
      window.history.replaceState({}, "", newUrl);
    }

    function parseFredCsv(csvText) {
      const rows = csvText.trim().split(/\r?\n/);
      const dates = [];
      const rates = [];

      for (let i = 1; i < rows.length; i++) {
        const cols = rows[i].split(",");
        if (cols.length < 2) continue;

        const date = cols[0].trim();
        const valueText = cols[1].trim();

        if (!date || valueText === ".") continue;

        const value = Number(valueText);
        if (Number.isFinite(value)) {
          dates.push(date);
          rates.push(value);
        }
      }

      return { dates, rates };
    }

    async function loadFxPair(pair) {
      const info = fredMap[pair];
      const fredUrl = `https://fred.stlouisfed.org/graph/fredgraph.csv?id=${info.id}`;

      document.getElementById("pairSelect").value = pair;
      document.getElementById("pageTitle").textContent = `${info.title} Spot FX History`;
      document.getElementById("status").textContent = `Loading ${info.title} from FRED...`;

      try {
        const response = await fetch(fredUrl);
        if (!response.ok) {
          throw new Error(`FRED request failed: ${response.status} ${response.statusText}`);
        }

        const csvText = await response.text();
        const parsed = parseFredCsv(csvText);

        if (parsed.dates.length === 0) {
          throw new Error("No usable FX data returned from FRED.");
        }

        const trace = {
          x: parsed.dates,
          y: parsed.rates,
          type: "scatter",
          mode: "lines",
          name: info.title,
          hovertemplate: "%{x}<br>Rate: %{y}<extra></extra>"
        };

        const layout = {
          title: `${info.title} Spot FX History`,
          xaxis: {
            title: "Date",
            rangeslider: { visible: true }
          },
          yaxis: {
            title: info.units,
            fixedrange: false
          },
          margin: { l: 70, r: 30, t: 70, b: 70 },
          hovermode: "x unified"
        };

        const config = {
          responsive: true,
          displaylogo: false
        };

        Plotly.newPlot("chart", [trace], layout, config);

        const firstDate = parsed.dates[0];
        const lastDate = parsed.dates[parsed.dates.length - 1];
        document.getElementById("status").textContent =
          `${info.title}: ${parsed.dates.length.toLocaleString()} observations, ${firstDate} to ${lastDate}. FRED series ${info.id}.`;
      } catch (error) {
        document.getElementById("status").textContent = `Error: ${error.message}`;
        document.getElementById("chart").innerHTML = "";
        console.error(error);
      }
    }

    function loadSelectedPair() {
      const pair = document.getElementById("pairSelect").value;
      setUrlPair(pair);
      loadFxPair(pair);
    }

    document.addEventListener("DOMContentLoaded", function () {
      const pair = getPairFromUrl();
      loadFxPair(pair);	
    }); 

  </script>
</body>
</html>
